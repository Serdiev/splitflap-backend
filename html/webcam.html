<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splitflap - Webcam</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4">
  <style>
    :root {
      --bb-bg: #000000;
      --bb-orange: #ff9900;
      --bb-orange-dim: #995500;
      --bb-gray: #333333;
      --bb-border: #444444;
      --bb-text: #ffffff;
      --bb-text-dim: #888888;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      background-color: var(--bb-bg);
      color: var(--bb-text);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }

    .terminal {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--bb-orange);
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .header-title {
      font-size: 24px;
      color: var(--bb-orange);
      font-weight: bold;
      letter-spacing: 4px;
    }

    .header-status {
      font-size: 12px;
      color: var(--bb-orange-dim);
    }

    .header {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      background: transparent;
      border: 1px solid var(--bb-orange);
      color: var(--bb-orange);
      padding: 8px 16px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:hover {
      background: var(--bb-orange);
      color: var(--bb-bg);
    }

    .panel {
      border: 1px solid var(--bb-border);
      margin-bottom: 15px;
      padding: 15px;
    }

    .panel-title {
      color: var(--bb-orange);
      font-size: 11px;
      letter-spacing: 2px;
      margin-bottom: 10px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--bb-border);
    }

    .webcam-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    .webcam-section {
      flex: 1;
      min-width: 200px;
    }

    .webcam-controls {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    video {
      display: block;
      max-width: 100%;
      border: 1px solid var(--bb-border);
    }

    canvas {
      display: inline-block;
      margin: 10px 0;
      border: 1px solid var(--bb-border);
    }

    #output {
      max-height: 200px;
      overflow: auto;
      font-size: 11px;
      color: var(--bb-text-dim);
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bb-bg);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--bb-border);
    }

    a {
      text-decoration: none;
    }
  </style>

  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
</head>

<body>
  <div class="terminal">
    <div class="header-bar">
      <div class="header-title">SPLITFLAP / WEBCAM</div>
      <div class="header-status">
        <a href="/"><button>Home</button></a>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">CAPTURE</div>
      <div class="webcam-container">
        <div class="webcam-section">
          <video id="video" autoplay></video>
          <div class="webcam-controls">
            <button id="capture">Take Picture</button>
            <button id="clear">Reset</button>
          </div>
        </div>
        <div class="webcam-section">
          <canvas id="canvas" width="64" height="64" style="display:none;"></canvas>
          <canvas id="preview" width="64" height="64"></canvas>
          <pre id="output"></pre>
        </div>
      </div>
    </div>
  </div>

  <script>
    const id = 'fredriks-spotify-account';
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas'); // hidden working canvas
    const ctx = canvas.getContext('2d');
    const preview = document.getElementById('preview'); // visible 64x64 result
    const previewCtx = preview.getContext('2d');
    const output = document.getElementById('output');

    // Ask for webcam
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => { video.srcObject = stream; })
      .catch(err => console.error("Error accessing webcam:", err));

    document.getElementById('clear').addEventListener('click', () => {
      console.log("clearing");
      fetch('/api/image/' + encodeURIComponent(id), {
        method: 'DELETE',
      })
        .then(async (res) => {
          if (res.status === 204) {
            output.textContent = 'Cleared successfully (204 No Content)';
          } else {
            const txt = await res.text();
            output.textContent = 'Failed to clear image: ' + res.status + '\n' + txt;
          }
        })
        .catch(err => {
          output.textContent = 'Clear error: ' + err;
        });
    });

    document.getElementById('capture').addEventListener('click', () => {
      // Ensure video metadata is available
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      if (!vw || !vh) {
        output.textContent = 'Video not ready. Please try again.';
        return;
      }

      // Center-crop to a square to preserve aspect ratio and avoid distortion
      const sSide = Math.min(vw, vh);
      const sx = Math.floor((vw - sSide) / 2);
      const sy = Math.floor((vh - sSide) / 2);

      // Disable smoothing for a crisp 64x64 pixel result
      ctx.imageSmoothingEnabled = false;
      previewCtx.imageSmoothingEnabled = false;

      // Draw the cropped square scaled down to 64x64
      ctx.drawImage(video, sx, sy, sSide, sSide, 0, 0, 64, 64);

      // Copy to preview canvas (so user sees the scaled-down result)
      previewCtx.drawImage(canvas, 0, 0);

      // Get pixel data
      const imageData = ctx.getImageData(0, 0, 64, 64);
      const data = imageData.data;
      const pixels = [];

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        pixels.push([r, g, b]);
      }

      // Convert flat pixels array into 64x64 rows of {r,g,b} objects
      const imageDataRows = [];
      for (let y = 0; y < 64; y++) {
        const row = [];
        for (let x = 0; x < 64; x++) {
          const idx = (y * 64 + x);
          const p = pixels[idx];
          row.push({ r: p[0], g: p[1], b: p[2] });
        }
        imageDataRows.push(row);
      }

      // Display result for debugging
      output.textContent = JSON.stringify(imageDataRows, null, 2);

      // POST to server
      fetch('/api/image/' + encodeURIComponent(id), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: imageDataRows })
      })
        .then(async (res) => {
          if (res.status === 204) {
            output.textContent = 'Upload successful (204 No Content)';
          } else {
            const txt = await res.text();
            output.textContent = 'Upload failed: ' + res.status + '\n' + txt;
          }
        })
        .catch(err => {
          output.textContent = 'Upload error: ' + err;
        });
    });
  </script>
</body>

</html>
