<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splitflap</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4">
  <style>
    :root {
      --bb-bg: #000000;
      --bb-orange: #ff9900;
      --bb-orange-dim: #995500;
      --bb-gray: #333333;
      --bb-border: #444444;
      --bb-text: #ffffff;
      --bb-text-dim: #888888;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      background-color: var(--bb-bg);
      color: var(--bb-text);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }

    .terminal {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--bb-orange);
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .header-title {
      font-size: 24px;
      color: var(--bb-orange);
      font-weight: bold;
      letter-spacing: 4px;
    }

    .header-status {
      font-size: 12px;
      color: var(--bb-orange-dim);
    }

    .header {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      background: transparent;
      border: 1px solid var(--bb-orange);
      color: var(--bb-orange);
      padding: 8px 16px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:hover {
      background: var(--bb-orange);
      color: var(--bb-bg);
    }

    .panel {
      border: 1px solid var(--bb-border);
      margin-bottom: 15px;
      padding: 15px;
    }

    .panel-title {
      color: var(--bb-orange);
      font-size: 11px;
      letter-spacing: 2px;
      margin-bottom: 10px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--bb-border);
    }

    .currently-playing {
      display: none;
      gap: 30px;
      font-size: 14px;
    }

    .currently-playing div {
      color: var(--bb-text);
    }

    .currently-playing span {
      color: var(--bb-orange-dim);
      margin-right: 8px;
    }

    .logged-in .currently-playing,
    .logged-in .check-currently-playing,
    .logged-in .toggle-active {
      display: flex;
    }

    .logged-in .fredrik-spotify-login {
      display: none;
    }

    .splitflap {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 3px;
    }

    .flap {
      position: relative;
      aspect-ratio: 0.618;
      border: 1px solid var(--bb-border);
      background: var(--bb-bg);
    }

    .inner {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      color: var(--bb-orange);
      font-family: inherit;
      font-size: clamp(24px, 6vw, 72px);
      font-weight: bold;
      text-align: center;
      text-transform: uppercase;
      outline: none;
    }

    .inner:focus {
      background: var(--bb-gray);
      color: var(--bb-orange);
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .log-panel {
      max-height: 200px;
      overflow-y: auto;
    }

    #messages-sent {
      font-size: 11px;
      color: var(--bb-text-dim);
    }

    #messages-sent div {
      padding: 2px 0;
      border-bottom: 1px solid var(--bb-border);
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bb-bg);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--bb-border);
    }

    a {
      text-decoration: none;
    }

    .log-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    @media (max-width: 768px) {
      .log-grid {
        grid-template-columns: 1fr;
      }
    }

    .image-grid {
      display: grid;
      grid-template-columns: repeat(64, 1fr);
      width: 320px;
      gap: 0;
      margin: 0 auto;
    }

    .image-pixel {
      aspect-ratio: 1;
    }
  </style>

  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
</head>

<body>
  <div class="terminal">
    <div class="header-bar">
      <div class="header-title">SPLITFLAP</div>
      <a href="webcam"><button>Webcam</button></a>
    </div>

    <div class="panel">
      <div class="panel-title">SPOTIFY CONTROL</div>
      <div class="header">
        <a class="fredrik-spotify-login" href="api/login?device_id=fredriks-spotify-account">
          <button id="spotify-login">Login</button>
        </a>
        <button class="check-currently-playing" onclick="currentlyPlaying()">Status</button>
      </div>
      <div class="currently-playing" style="margin-top: 15px;">
        <div><span>SONG:</span><span class="song">N/A</span></div>
        <div><span>ARTIST:</span><span class="artist">N/A</span></div>
        <div><span>TIME:</span><span class="time-left">N/A</span></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">MESSAGE INPUT</div>
      <div class="splitflap">
      </div>
      <div class="controls" style="justify-content: space-between;">
        <button class="toggle-active" onclick="toggleActive()">Enable</button>
        <button onclick="sendMessage()">Update Flaps</button>
      </div>
    </div>

    <div class="log-grid">
      <div class="panel log-panel">
        <div class="panel-title">MESSAGE LOG</div>
        <div id="messages-sent">
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">ALBUM PREVIEW</div>
        <div class="image-grid" id="image-grid">
        </div>
      </div>
    </div>
  </div>

  <script>
    function currentlyPlaying() {
      $.ajax({
        type: "GET",
        url: "/api/status",
        contentType: "application/json; charset=utf-8",
        dataType: "json",
        success: function (response) {
          console.log("Currently playing:", response);
          if (response.playing == null) {
            $('.song').text("N/A")
            $('.artist').text("N/A")
            $('.time-left').text("N/A")
            return
          }
          $('.song').text(response.playing.song)
          $('.artist').text(response.playing.artist)
          $('.time-left').text(response.playing.timeLeft)
        },
        error: function (error) {
          console.error("Error sending message:", error);
        }
      });
    }

    function toggleActive() {
      $.ajax({
        type: "POST",
        url: "/api/toggle",
        success: function (response) {
          updateToggleButton(response["isActive"]);
        },
        error: function (error) {
          console.error("Error sending message:", error);
        }
      });
    }

    function updateToggleButton(isActive) {
      const btn = document.querySelector('.toggle-active');
      btn.textContent = isActive ? "Disable" : "Enable";
    }

    function isMobile() {
      return /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }

    const params = new URLSearchParams(window.location.search)
    if (params.get('message') === 'logged_in') {
      $('body').toggleClass("logged-in", true);
    }
  </script>

  <script>
    function log(message) {
      const newMessageDiv = $("<div>").text(message);
      $('#messages-sent').prepend(newMessageDiv);
    }

    const sf = document.querySelector('.splitflap');

    for (let i = 0; i < 24; i++) {
      const flap = document.createElement('div');
      flap.className = 'flap';
      sf.appendChild(flap);

      const inner = document.createElement('input');
      inner.className = 'inner';
      inner.maxLength = 1;

      flap.appendChild(inner);
    }

    const flapInputs = document.querySelectorAll('.inner')

    $.ajax({
      type: "GET",
      url: "/api/message",
      contentType: "application/json; charset=utf-8",
      dataType: "json",
      success: function (response) {
        console.log("Message received successfully:", response);
        for (let i = 0; i < flapInputs.length; i++) {
          flapInputs[i].value = response.currentText[i].toUpperCase().replace(" ", "");
        }
      },
      error: function (error) {
        console.error("Error getting message:", error);
      }
    });


    const setInput = (i, value) => {
      flapInputs[i].value = value;
    }

    for (let i = 0; i < flapInputs.length; i++) {

      flapInputs[i].addEventListener('focus', (event) => {
        if (flapInputs[i].value.length >= 1) {
          flapInputs[i].value = "";
        }
      })

      flapInputs[i].addEventListener('input', (event) => {
        if (event.target.value.length >= 1 && i != 23) {
          flapInputs[i + 1].focus();
          if (flapInputs[i + 1].value.length >= 1) {
            flapInputs[i + 1].value = "";
          }
        } else if (i == 23) {
          flapInputs[i].blur();
        } else if (i != 0 && i != 23) {
          if (flapInputs[i - 1].value.length >= 1) {
            flapInputs[i - 1].value = "";
          }

          flapInputs[i - 1].focus()
        }
      });

      if (isMobile) {
        flapInputs[i].onkeydown = (event) => {
          const pressed = event.key
          if (pressed == "Backspace") {
            flapInputs[i].value = ''
            if (i != 0) {
              flapInputs[i - 1].focus()
            }
          }
        }
      }

      if (!isMobile()) {
        flapInputs[i].onkeydown = (event) => {
          console.log("keydown")
          const pressed = event.key
          if (pressed == "Backspace") {
            flapInputs[i].value = ''
            if (i != 0) {
              flapInputs[i - 1].focus()
            }
          } else if (pressed == "Delete") {
            flapInputs[i].value = ''
            if (i == 23) return
            flapInputs[i + 1].focus()
          } else if (pressed.includes("Left")) {
            if (i == 0) return
            flapInputs[i - 1].focus()
          } else if (pressed.includes("Up")) {
            if (i < 12) return
            flapInputs[i - 12].focus()
          } else if (pressed.includes("Right")) {
            if (i == 23) return
            flapInputs[i + 1].focus()
          } else if (pressed.includes("Down")) {
            if (i > 11) return
            flapInputs[i + 12].focus()
          }
          else if (pressed.length == 1 && isMobile()) {
            flapInputs[i].value = pressed.toUpperCase()
            if (i == 23) return
            flapInputs[i + 1].focus()
          }
        }
      }
    }

    const socket = new WebSocket('wss://' + window.location.host + '/api/ws');
    socket.onmessage = function (event) {
      const currentText = JSON.parse(event.data).currentText
      for (let i = 0; i < flapInputs.length; i++) {
        flapInputs[i].value = currentText[i].toUpperCase();
      }
    };

    const imageGrid = document.getElementById('image-grid');
    for (let i = 0; i < 64 * 64; i++) {
      const pixel = document.createElement('div');
      pixel.className = 'image-pixel';
      imageGrid.appendChild(pixel);
    }

    const imgSocket = new WebSocket('wss://' + window.location.host + '/api/ws-img/fredriks-spotify-account');
    imgSocket.onmessage = function (event) {
      if (event.data == "no-image") {
        const pixels = document.querySelectorAll('.image-pixel');
        pixels.forEach(pixel => {
          pixel.style.backgroundColor = `rgb(0, 0, 0)`;
        });
        return;
      }

      event.data.arrayBuffer().then(function (buffer) {
        const bytes = new Uint8Array(buffer);
        const width = bytes[0];
        const height = bytes[1];
        const pixels = document.querySelectorAll('.image-pixel');
        for (let i = 0; i < pixels.length; i++) {
          const idx = 2 + i * 3;
          pixels[i].style.backgroundColor = `rgb(${bytes[idx]}, ${bytes[idx + 1]}, ${bytes[idx + 2]})`;
        }
      });
      currentlyPlaying();
    };

    function sendMessage() {
      let message = "";
      const flaps = document.querySelectorAll('.inner');
      flaps.forEach(flap => {
        console.log("-" + flap.value + "-");
        if (flap.value.length == 0) {
          message += " "
        } else {
          message += flap.value;
        }
      });

      var data = {
        message: message
      };

      $.ajax({
        type: "POST",
        url: "/api/message",
        data: JSON.stringify(data),
        contentType: "application/json; charset=utf-8",
        dataType: "json",
        success: function (response) {
          log(data.message);
        },
        error: function (error) {
          console.error("Error sending message:", error);
        }
      });
    }

    $.ajax({
      type: "GET",
      url: "/api/status",
      contentType: "application/json; charset=utf-8",
      dataType: "json",
      success: function (response) {
        $('body').toggleClass("logged-in", response.isSpotifyLogin);
        updateToggleButton(response.isEnabled);
        if (response.currentText) {
          const flaps = document.querySelectorAll('.inner');
          for (let i = 0; i < flaps.length; i++) {
            flaps[i].value = response.currentText[i] ? response.currentText[i].toUpperCase() : "";
          }
        }
        if (response.image) {
          const imgBytes = atob(response.image);
          const bytes = new Uint8Array(imgBytes.length);
          for (let i = 0; i < imgBytes.length; i++) {
            bytes[i] = imgBytes.charCodeAt(i);
          }
          const width = bytes[0];
          const height = bytes[1];
          const pixels = document.querySelectorAll('.image-pixel');
          for (let i = 0; i < pixels.length; i++) {
            const idx = 2 + i * 3;
            pixels[i].style.backgroundColor = `rgb(${bytes[idx]}, ${bytes[idx + 1]}, ${bytes[idx + 2]})`;
          }
        }
        console.log("Status response:", response);
      },
      error: function (error) {
        console.error("Error getting status:", error);
      }
    });
  </script>
</body>

</html>
